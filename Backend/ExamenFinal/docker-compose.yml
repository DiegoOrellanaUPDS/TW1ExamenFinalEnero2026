version: '3.9'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: examenfinaldb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: examenfinal_api
    depends_on:
      - db
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=examenfinaldb;Username=postgres;Password=2123"
    ports:
      - "5000:80"

volumes:
  pgdata:
